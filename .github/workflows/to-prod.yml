name: Deploy to production
on:
  push:
    branches:
      - main
jobs:
  # The Remix/React Router app itself is hosted on Vercel and deploys
  # automatically via Vercel's Git integration on every push to main.
  # This workflow only deploys the Shopify app configuration + the
  # payment-customization Function/extension via the Shopify CLI.
  shopify-deploy:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          npm install -g @shopify/cli
          npm install
      - name: Deploy Shopify app config + extensions
        env:
          # Token from the Partner Dashboard
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}
        run: |
          shopify app deploy --force \
            --source-control-url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
